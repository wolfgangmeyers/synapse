name: Mecha Messaging

on:
  push:
    paths:
      - ".github/workflows/mecha-messaging.yml"
      - "package.json"
      - "package-lock.json"
      - "pi-extensions/mecha-messaging/**"
      - "harness/mailbox-client.js"
      - "discord-gateway-bridge/main.mjs"
      - ".claude/skills/supervisor/tools/claude_sidecar.mjs"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/mecha-messaging.yml"
      - "package.json"
      - "package-lock.json"
      - "pi-extensions/mecha-messaging/**"
      - "harness/mailbox-client.js"
      - "discord-gateway-bridge/main.mjs"
      - ".claude/skills/supervisor/tools/claude_sidecar.mjs"
      - "tests/**"

jobs:
  mecha-messaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix pi-extensions/mecha-messaging
      - run: npm run check:mecha-messaging
      - run: npm test
      - run: node --test tests/claude_sidecar.test.mjs tests/discord_gateway_bridge.test.mjs
