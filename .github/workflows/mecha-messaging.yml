name: Mecha Messaging

on:
  push:
    paths:
      - ".github/workflows/mecha-messaging.yml"
      - "package.json"
      - "package-lock.json"
      - "pi-extensions/mecha-messaging/**"
      - "pi-extensions/mecha-messaging/mailbox-client.js"
      - "tests/**"
      - "web/router-ui-react/**"
      - "router-proxy/**"
      - "tools/**"
  pull_request:
    paths:
      - ".github/workflows/mecha-messaging.yml"
      - "package.json"
      - "package-lock.json"
      - "pi-extensions/mecha-messaging/**"
      - "pi-extensions/mecha-messaging/mailbox-client.js"
      - "tests/**"
      - "web/router-ui-react/**"
      - "router-proxy/**"
      - "tools/**"

jobs:
  mecha-messaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix pi-extensions/mecha-messaging
      - run: npm ci --prefix web/router-ui-react
      - run: npm run test:acceptance:node --prefix web/router-ui-react
      - run: npm run check:mecha-messaging
      - run: xvfb-run --auto-servernum -- npm test
